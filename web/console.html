<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM 视觉识别平台</title>
<link rel="icon" href="/ui/favicon.ico">
<link rel="stylesheet" href="/ui/console.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="brand">
      <div class="logo">S</div>
      <div><b>SPM 视觉识别</b><span>工单照片智能审核</span></div>
    </div>

    <div class="nav-group">
      <i>核心</i>
      <a class="nav-item on" href="#overview" data-view="overview"><span class="ico">◧</span>总览</a>
      <a class="nav-item" href="#infer" data-view="infer"><span class="ico">▣</span>在线识别</a>
      <a class="nav-item" href="#model" data-view="model"><span class="ico">◈</span>模型版本</a>
      <a class="nav-item" href="#dataset" data-view="dataset"><span class="ico">▤</span>数据集</a>
    </div>
    <div class="nav-group">
      <i>质量</i>
      <a class="nav-item" href="#eval" data-view="eval" hidden><span class="ico">◔</span>精度评测</a>
      <a class="nav-item" href="#mistakes" data-view="mistakes"><span class="ico">⚠</span>错误样本</a>
      <a class="nav-item" href="#label" data-view="label"><span class="ico">✎</span>快速标注</a>
      <a class="nav-item" href="#train" data-view="train" hidden><span class="ico">↗</span>训练曲线</a>
    </div>
    <div class="foot" id="modelVersion">模型信息加载中</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="sidebar">☰</button>
      <h1 id="pageTitle">总览</h1>
      <div class="right">
        <span id="svcDot" class="dot" aria-hidden="true"></span>
        <span id="svcText" role="status" aria-live="polite">检查中</span>
      </div>
    </header>

    <main class="page" id="main">
      <div id="globalWarn"></div>
      <!-- 总览 -->
      <section class="view" id="view-overview">
        <div class="kpis" id="kpis"></div>
        <div class="row">
          <div class="card">
            <div class="card-head"><span class="t">各类准确率</span>
              <div class="seg"><button class="on" data-eval="new">新数据</button><button data-eval="old">老数据</button></div>
            </div>
            <div id="accChart"></div>
          </div>
          <div class="card">
            <div class="card-head"><span class="t">服务状态</span><span class="pill ok" id="modelsOnline">—</span></div>
            <div id="modelList"></div>
          </div>
        </div>
      </section>

      <!-- 在线识别：左图带框，右结论 -->
      <section class="view" id="view-infer" hidden>
        <div class="infer-grid">
          <div class="infer-left">
            <div class="seg" id="catSeg">
              <button class="on" data-cat="arrival">接车照片</button>
              <button data-cat="repair">故障及修复</button>
              <button data-cat="inspection">项目检查表</button>
            </div>

            <div class="infer-params" id="inferParams"></div>
            <div class="filelist" id="fileList" hidden></div>

            <div class="infer-stage" id="inferStage">
              <div class="infer-img" id="inferImgWrap" hidden>
                <img id="inferImg" alt="">
                <div class="boxes" id="inferBoxes"></div>
                <button class="nav-btn prev" id="inferPrev" title="上一张">‹</button>
                <button class="nav-btn next" id="inferNext" title="下一张">›</button>
                <span class="counter" id="inferCounter"></span>
              </div>
              <label class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖入照片">
                <input id="files" type="file" accept="image/*" multiple hidden>
                <span class="plus">+</span>
                <span class="hint" id="hint">点击或拖入接车照片</span>
              </label>
            </div>

            <button class="btn" id="run" disabled>识别</button>
            <div class="infer-limits" id="inferLimits"></div>
          </div>

          <div class="infer-right" id="out" role="region" aria-label="识别结果" aria-live="polite"></div>
        </div>
      </section>

      <!-- 数据集：上传 + 自动标注 -->
      <section class="view" id="view-dataset" hidden>
        <div class="card">
          <div class="card-head"><span class="t">上传数据集</span>
            <span class="hint">zip 内按类别建目录：01_桥放油/ 或 bridge_drain/</span></div>
          <label class="drop" id="dsDrop" tabindex="0" role="button" aria-label="选择或拖入数据集 zip">
            <input id="dsFile" type="file" accept=".zip" hidden>
            <span class="plus">+</span>
            <span class="hint" id="dsHint">点击或拖入 zip（≤2GB），目录名会自动映射到 12 类</span>
          </label>
          <div id="dsResult"></div>
        </div>

        <div class="card" style="margin-top:14px">
          <div class="card-head"><span class="t">已上传批次</span>
            <span class="hint" id="dsCount">—</span></div>
          <div id="dsBatches"></div>
        </div>
      </section>

      <!-- 评测 -->
      <section class="view" id="view-eval" hidden>
        <div class="card" id="evalCard"></div>
      </section>

      <!-- 错误样本 -->
      <section class="view" id="view-mistakes" hidden>
        <div class="ds-wrap">
          <div class="card">
            <div class="seg" id="mSource">
              <button class="on" data-src="all">全部</button>
              <button data-src="new">新数据</button>
              <button data-src="old">老数据</button>
            </div>
            <div id="mGroups" class="classes"></div>
          </div>
          <div class="card">
            <div class="card-head">
              <span class="t" id="mTitle">选择左侧分组</span>
              <div class="acts">
                <button class="ghost" id="mSelectAll">全选本组</button>
                <select id="mTarget" class="hint"
                        style="padding:5px 8px;border:1px solid var(--line);border-radius:8px"></select>
                <button class="btn" id="mRelabel" disabled
                        style="padding:5px 12px;font-size:12px">加入改标计划</button>
                <button class="ghost" id="mSave" disabled>登记为难例</button>
              </div>
            </div>
            <div id="mGrid" class="mistakes"></div>
            <div class="mgrid-foot" id="mFoot"></div>
          </div>
        </div>
      </section>

      <!-- 标注（列表 + 图上框） -->
      <section class="view" id="view-label" hidden>
        <div class="card">
          <div class="card-head">
            <div class="seg" id="lFam">
              <button class="on" data-fam="oil">油液 / 滤芯</button>
              <button data-fam="arrival">接车</button>
              <button data-fam="sheet">服务单</button>
            </div>
            <input id="lSearch" placeholder="筛选文件名…" class="hint"
                   style="width:180px;padding:5px 9px;border:1px solid var(--line);border-radius:8px">
            <span class="hint" id="lProgress">—</span>
          </div>

          <div class="batchbar" id="lBatch" hidden>
            <span id="lBatchCount">已选 0 张</span>
            <select id="lBatchLabel" class="hint"
                    style="padding:5px 8px;border:1px solid var(--line);border-radius:8px"></select>
            <button class="btn" id="lApply" style="padding:5px 14px;font-size:12px">应用到选中</button>
            <button class="ghost" id="lClear">取消选择</button>
          </div>

          <div id="lBanner"></div>
          <div id="lGrid" class="lgrid"></div>
          <div class="more" id="lMore"></div>
        </div>
      </section>

      <!-- 模型版本 -->
      <section class="view" id="view-model" hidden>
        <div class="card" style="margin-bottom:14px">
          <div class="card-head"><span class="t">训练</span>
            <span class="hint">训练会吃满 CPU/GPU，同一时间只跑一个任务</span></div>
          <div class="trainform">
            <label>数据
              <select id="trData"></select>
            </label>
            <label>epochs
              <input id="trEpochs" type="number" min="1" max="200" value="25">
            </label>
            <label>imgsz
              <input id="trImgsz" type="number" min="256" max="1024" step="32" value="512">
            </label>
            <button class="btn" id="trStart">开始训练</button>
            <button class="ghost" id="trCancel" hidden>取消</button>
          </div>
          <div id="trStatus" class="trainstatus"></div>
        </div>

        <div class="card">
          <div class="card-head"><span class="t">模型版本</span>
            <span class="hint" id="modelHint">切换后自动热加载，无需重启</span></div>
          <div id="modelTable"></div>
        </div>
      </section>

      <!-- 训练曲线 -->
      <section class="view" id="view-train" hidden>
        <div class="card" id="trainCard"></div>
      </section>
    </main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="viewer" hidden>
  <div class="modal-box">
    <div class="modal-img">
      <img id="vImg" alt="">
      <div class="boxes" id="vBoxes"></div>
      <button class="nav-btn prev" id="vPrev" title="上一张 (←)">‹</button>
      <button class="nav-btn next" id="vNext" title="下一张 (→)">›</button>
      <span class="counter" id="vCount"></span>
    </div>
    <div class="modal-side">
      <div class="card-head" style="margin:0">
        <h4 id="vTitle">—</h4>
        <button class="ghost modal-close" id="vClose">关闭</button>
      </div>
      <div class="fname" id="vName"></div>
      <div id="vMeta"></div>
      <label class="hint" style="margin-top:auto"><input type="checkbox" id="vShowBoxes" checked> 显示检测框</label>
    </div>
  </div>
</div>

<script src="/ui/sso.js"></script>
<script src="/ui/console.js"></script>
</body>
</html>
