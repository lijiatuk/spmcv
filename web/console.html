<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM 视觉识别平台</title>
<link rel="icon" href="/ui/favicon.ico">
<link rel="stylesheet" href="/ui/console.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">S</div>
      <div><b>SPM 视觉识别</b><span>工单照片智能审核</span></div>
    </div>

    <div class="nav-group">
      <i>核心</i>
      <a class="nav-item on" data-view="overview"><span class="ico">◧</span>总览</a>
      <a class="nav-item" data-view="infer"><span class="ico">▣</span>在线识别</a>
      <a class="nav-item" data-view="model"><span class="ico">◈</span>模型版本</a>
      <a class="nav-item" data-view="dataset" hidden><span class="ico">▤</span>数据集</a>
    </div>
    <div class="nav-group">
      <i>质量</i>
      <a class="nav-item" data-view="eval" hidden><span class="ico">◔</span>精度评测</a>
      <a class="nav-item" data-view="mistakes"><span class="ico">⚠</span>错误样本</a>
      <a class="nav-item" data-view="label"><span class="ico">✎</span>快速标注</a>
      <a class="nav-item" data-view="train" hidden><span class="ico">↗</span>训练曲线</a>
    </div>
    <div class="foot" id="modelVersion">模型信息加载中</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">总览</h1>
      <div class="right">
        <span id="svcDot" class="dot"></span>
        <span id="svcText">检查中</span>
      </div>
    </header>

    <div class="page">
      <!-- 总览 -->
      <section class="view" id="view-overview">
        <div class="kpis" id="kpis"></div>
        <div class="row">
          <div class="card">
            <div class="card-head"><span class="t">各类准确率</span>
              <div class="seg"><button class="on" data-eval="new">新数据</button><button data-eval="old">老数据</button></div>
            </div>
            <div id="accChart"></div>
          </div>
          <div class="card">
            <div class="card-head"><span class="t">服务状态</span><span class="pill ok" id="modelsOnline">—</span></div>
            <div id="modelList"></div>
          </div>
        </div>
      </section>

      <!-- 在线识别 -->
      <section class="view" id="view-infer" hidden>
        <div class="infer-wrap">
          <div class="seg" id="catSeg">
            <button class="on" data-cat="arrival">接车照片</button>
            <button data-cat="repair">故障及修复</button>
            <button data-cat="inspection">项目检查表</button>
          </div>
          <label class="drop" id="drop">
            <input id="files" type="file" accept="image/*" multiple hidden>
            <span class="plus">+</span>
            <span class="hint" id="hint">点击或拖入接车照片</span>
          </label>
          <div class="preview" id="preview"></div>
          <button class="btn" id="run" disabled>识别</button>
          <div id="out"></div>
        </div>
      </section>

      <!-- 数据集 -->
      <section class="view" id="view-dataset" hidden>
        <div class="ds-wrap">
          <div class="card">
            <select id="root" class="hint" style="width:100%;margin-bottom:8px;padding:4px"></select>
            <div id="classes" class="classes"></div>
          </div>
          <div class="card">
            <div class="card-head">
              <span class="t" id="clsTitle">选择左侧类别</span>
              <input id="q" placeholder="筛选文件名…" class="hint"
                     style="width:180px;padding:5px 9px;border:1px solid var(--line);border-radius:8px">
              <span class="hint" id="clsHint">点任意一行查看大图与标注</span>
            </div>
            <div id="cards" class="cards"></div>
          </div>
        </div>
      </section>

      <!-- 评测 -->
      <section class="view" id="view-eval" hidden>
        <div class="card" id="evalCard"></div>
      </section>

      <!-- 错误样本 -->
      <section class="view" id="view-mistakes" hidden>
        <div class="ds-wrap">
          <div class="card">
            <div class="seg" id="mSource">
              <button class="on" data-src="all">全部</button>
              <button data-src="new">新数据</button>
              <button data-src="old">老数据</button>
            </div>
            <div id="mGroups" class="classes"></div>
          </div>
          <div class="card">
            <div class="card-head">
              <span class="t" id="mTitle">选择左侧分组</span>
              <div class="acts">
                <button class="ghost" id="mSelectAll">全选本组</button>
                <select id="mTarget" class="hint"
                        style="padding:5px 8px;border:1px solid var(--line);border-radius:8px"></select>
                <button class="btn" id="mRelabel" disabled
                        style="padding:5px 12px;font-size:12px">加入改标计划</button>
                <button class="ghost" id="mSave" disabled>登记为难例</button>
              </div>
            </div>
            <div id="mGrid" class="mistakes"></div>
          </div>
        </div>
      </section>

      <!-- 标注（列表 + 图上框） -->
      <section class="view" id="view-label" hidden>
        <div class="card">
          <div class="card-head">
            <div class="seg" id="lFam">
              <button class="on" data-fam="oil">油液 / 滤芯</button>
              <button data-fam="arrival">接车</button>
              <button data-fam="sheet">服务单</button>
            </div>
            <input id="lSearch" placeholder="筛选文件名…" class="hint"
                   style="width:180px;padding:5px 9px;border:1px solid var(--line);border-radius:8px">
            <span class="hint" id="lProgress">—</span>
          </div>

          <div class="batchbar" id="lBatch" hidden>
            <span id="lBatchCount">已选 0 张</span>
            <select id="lBatchLabel" class="hint"
                    style="padding:5px 8px;border:1px solid var(--line);border-radius:8px"></select>
            <button class="btn" id="lApply" style="padding:5px 14px;font-size:12px">应用到选中</button>
            <button class="ghost" id="lClear">取消选择</button>
          </div>

          <div id="lGrid" class="lgrid"></div>
          <div class="more" id="lMore"></div>
        </div>
      </section>

      <!-- 模型版本 -->
      <section class="view" id="view-model" hidden>
        <div class="card">
          <div class="card-head"><span class="t">模型版本</span>
            <span class="hint" id="modelHint">切换后需重启 vision 服务生效</span></div>
          <div id="modelTable"></div>
        </div>
      </section>

      <!-- 训练曲线 -->
      <section class="view" id="view-train" hidden>
        <div class="card" id="trainCard"></div>
      </section>
    </div>
  </div>
</div>
<div class="modal" id="viewer" hidden>
  <div class="modal-box">
    <div class="modal-img">
      <img id="vImg" alt="">
      <div class="boxes" id="vBoxes"></div>
      <button class="nav-btn prev" id="vPrev" title="上一张 (←)">‹</button>
      <button class="nav-btn next" id="vNext" title="下一张 (→)">›</button>
      <span class="counter" id="vCount"></span>
    </div>
    <div class="modal-side">
      <div class="card-head" style="margin:0">
        <h4 id="vTitle">—</h4>
        <button class="ghost modal-close" id="vClose">关闭</button>
      </div>
      <div class="fname" id="vName"></div>
      <div id="vMeta"></div>
      <label class="hint" style="margin-top:auto"><input type="checkbox" id="vShowBoxes" checked> 显示检测框</label>
    </div>
  </div>
</div>

<script src="/ui/sso.js"></script>
<script src="/ui/console.js"></script>
</body>
</html>
