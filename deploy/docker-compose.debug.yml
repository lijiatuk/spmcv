# 调试用覆盖文件：把内部三个端口映射到**本机回环**，便于逐层验证。
#   生产不要用这个文件。
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.debug.yml up -d
#   curl localhost:8017/healthz   # api
#   curl localhost:8016/healthz   # vision
#   curl localhost:8018/healthz   # ocr
services:
  api:
    ports:
      - "127.0.0.1:8017:8017"
  vision:
    ports:
      - "127.0.0.1:8016:8016"
  ocr:
    ports:
      - "127.0.0.1:8018:8018"
