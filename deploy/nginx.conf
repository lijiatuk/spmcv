worker_processes auto;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # API allows up to 80 MiB image payload per work order; leave room for multipart headers.
    client_max_body_size 20m;

    # 控制台是 82KB 的 JS+CSS，内网也值得压一下：55KB → 约 14KB。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
    upstream spm_api {
        server api:8017;
        keepalive 64;
    }
    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;

        location /ui/ {
            proxy_pass http://spm_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /v1/ {
            # 32 并发 + 突发：burst 给足，nodelay 让排队请求立即转发，
            # 真正的并发控制在 api 的准入信号量里，不在 nginx 排队。
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://spm_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 单张识别承诺 5s，给到 10s 兜底，避免 nginx 先于业务超时
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_connect_timeout 3s;
        }
        location / {
            proxy_pass http://spm_api;
            proxy_set_header Host $host;
        }
    }
}
