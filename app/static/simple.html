<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM 识别</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>SPM 识别</h1>
    <span id="dot" class="dot" title="服务状态"></span>
    <a class="navlink" href="/ui/viz.html">数据看板 →</a>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-cat="arrival">接车照片</button>
    <button class="tab" data-cat="repair">故障及修复</button>
    <button class="tab" data-cat="inspection">项目检查表</button>
  </nav>

  <label id="drop" class="drop">
    <input id="files" type="file" accept="image/*" multiple hidden>
    <span class="plus">+</span>
    <span id="hint" class="hint">点击或拖入照片</span>
  </label>

  <div id="preview" class="preview"></div>

  <button id="run" disabled>识别</button>

  <section id="out"></section>
</main>
<script src="app.js"></script>
</body>
</html>
